name: Generate full-book Hebrew niqqud

on:
  push:
    branches:
      - hebrew-reader
    paths:
      - .github/workflows/vocalize-book.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vocalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reader branch
        uses: actions/checkout@v4
        with:
          ref: hebrew-reader
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests

      - name: Vocalize complete source
        run: python scripts/vocalize_book.py

      - name: Commit full niqqud edition to reader branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/book-with-niqqud.txt data/book-with-niqqud.json data/niqqud-metadata.json
          git commit -m "Add full-book Hebrew niqqud edition"
          git push origin HEAD:hebrew-reader

      - name: Upload downloadable niqqud files
        uses: actions/upload-artifact@v4
        with:
          name: hebrew-book-with-niqqud
          path: |
            data/book-with-niqqud.txt
            data/book-with-niqqud.json
            data/niqqud-metadata.json
          if-no-files-found: error
          retention-days: 14
