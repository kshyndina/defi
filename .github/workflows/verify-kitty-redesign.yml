name: verify-kitty-redesign
on:
  push:
    paths:
      - '.github/workflows/verify-kitty-redesign.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify redesigned Kitty scanner
        run: |
          set -euo pipefail
          URL="https://kitty-opendex.vercel.app"
          code=$(curl -L -sS -o /tmp/page.html -w "%{http_code}" "$URL/")
          echo "homepage_status=$code"
          test "$code" = "200"
          grep -q "serious flow" /tmp/page.html
          grep -q "KITTY TERMINAL" /tmp/page.html
          grep -q "kitty.css" /tmp/page.html
          css=$(curl -L -sS -o /tmp/style.css -w "%{http_code}" "$URL/style.css")
          kitty=$(curl -L -sS -o /tmp/kitty.css -w "%{http_code}" "$URL/kitty.css")
          js=$(curl -L -sS -o /tmp/app.js -w "%{http_code}" "$URL/app.js")
          echo "assets style=$css kitty=$kitty js=$js"
          test "$css" = "200"
          test "$kitty" = "200"
          test "$js" = "200"
          grep -q "kitty-rig" /tmp/style.css
          grep -q "#head" /tmp/kitty.css

          body='{"sources":{"new":{},"trending":{},"topVolume":{},"topGainers":{}}}'
          code=$(curl -L -sS -o /tmp/api.json -w "%{http_code}"             -X POST "$URL/api/scanner"             -H 'content-type: application/json'             -H 'accept: application/json'             --data "$body")
          echo "api_status=$code"
          test "$code" = "200"
          python - <<'PY'
          import json
          with open('/tmp/api.json') as f: d=json.load(f)
          views=['new','trending','topVolume','topGainers']
          total=0
          for v in views:
              src=d.get(v)
              assert src is not None, f"{v} is null"
              if isinstance(src,list): total+=len(src)
              elif isinstance(src,dict):
                  for k in ('tokens','items','results','data'):
                      if isinstance(src.get(k),list):
                          total+=len(src[k]); break
          print('token_count=', total)
          print('source_failures=', d.get('meta',{}).get('sourceFailures'))
          assert total>0
          PY
