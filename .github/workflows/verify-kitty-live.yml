name: verify-kitty-live
on:
  push:
    paths:
      - '.github/workflows/verify-kitty-live.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public Kitty scanner
        run: |
          set -euo pipefail
          URL=""
          for candidate in             "https://kitty-opendex.vercel.app"             "https://kitty-opendex-kshyndinas-projects.vercel.app"             "https://kitty-opendex-dmlodkw17-kshyndinas-projects.vercel.app"
          do
            code=$(curl -L -sS -o /tmp/page.html -w "%{http_code}" "$candidate/" || true)
            echo "$candidate homepage=$code preview=$(head -c 100 /tmp/page.html | tr '\n' ' ')"
            if [ "$code" = "200" ] && grep -q "Hello Kitty" /tmp/page.html && grep -q "OpenDEX" /tmp/page.html; then
              URL="$candidate"
              break
            fi
          done
          test -n "$URL"
          echo "LIVE_URL=$URL"

          body='{"sources":{"new":{},"trending":{},"topVolume":{},"topGainers":{}}}'
          code=$(curl -L -sS -o /tmp/api.json -w "%{http_code}"             -X POST "$URL/api/scanner"             -H 'content-type: application/json'             -H 'accept: application/json'             --data "$body")
          echo "api_status=$code"
          echo "api_preview=$(head -c 500 /tmp/api.json | tr '\n' ' ')"
          test "$code" = "200"

          python - <<'PY'
          import json
          with open('/tmp/api.json') as f:
              data=json.load(f)
          views=['new','trending','topVolume','topGainers']
          total=0
          non_null=0
          for k in views:
              src=data.get(k)
              if src is None:
                  continue
              non_null+=1
              if isinstance(src,list):
                  total+=len(src)
              elif isinstance(src,dict):
                  for key in ('tokens','items','results','data'):
                      if isinstance(src.get(key),list):
                          total+=len(src[key]); break
          print('keys=',list(data)[:20])
          print('non_null_views=',non_null)
          print('token_count=',total)
          print('source_failures=',data.get('meta',{}).get('sourceFailures'))
          assert non_null>0
          assert total>0
          PY
