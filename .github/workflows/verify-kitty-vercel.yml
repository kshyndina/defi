name: verify-kitty-vercel
on:
  push:
    paths:
      - '.github/workflows/verify-kitty-vercel.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public Vercel test
        run: |
          set -euo pipefail
          URL="https://kitty-public-test-ngkuqqbnj-kshyndinas-projects.vercel.app/"
          code=$(curl -L -sS -o /tmp/page.html -w "%{http_code}" "$URL")
          echo "status=$code"
          echo "preview=$(head -c 250 /tmp/page.html | tr '\n' ' ')"
          test "$code" = "200"
          grep -q "KITTY_PUBLIC_OK" /tmp/page.html
