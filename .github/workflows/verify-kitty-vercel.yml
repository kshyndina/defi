name: verify-kitty-vercel
on:
  push:
    paths:
      - '.github/workflows/verify-kitty-vercel.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Vercel hostnames
        run: |
          set -u
          for URL in             "https://hello-kitty-opendex-live-kshyndinas-projects.vercel.app"             "https://hello-kitty-opendex-live-2c9bs7tln-kshyndinas-projects.vercel.app"             "https://hello-kitty-opendex-live-mlexlo3xi-kshyndinas-projects.vercel.app"
          do
            echo "=== $URL ==="
            code=$(curl -L -sS -o /tmp/page.html -w "%{http_code}" "$URL/" || true)
            echo "homepage_status=$code"
            echo "content_type=$(curl -L -sSI "$URL/" | grep -i '^content-type:' | tail -1 | tr -d '\r' || true)"
            echo "preview=$(head -c 220 /tmp/page.html | tr '\n' ' ' || true)"
          done

      - name: Verify whichever hostname is live
        run: |
          set -euo pipefail
          URL=""
          for candidate in             "https://hello-kitty-opendex-live-kshyndinas-projects.vercel.app"             "https://hello-kitty-opendex-live-2c9bs7tln-kshyndinas-projects.vercel.app"             "https://hello-kitty-opendex-live-mlexlo3xi-kshyndinas-projects.vercel.app"
          do
            code=$(curl -L -sS -o /tmp/page.html -w "%{http_code}" "$candidate/" || true)
            if [ "$code" = "200" ] && grep -q "Hello Kitty" /tmp/page.html && grep -q "OpenDEX" /tmp/page.html; then
              URL="$candidate"
              break
            fi
          done
          test -n "$URL"
          echo "LIVE_URL=$URL"

          body='{"sources":{"new":{},"trending":{},"topVolume":{},"topGainers":{}}}'
          code=$(curl -L -sS -o /tmp/api.json -w "%{http_code}"             -X POST "$URL/api/scanner"             -H 'content-type: application/json'             -H 'accept: application/json'             --data "$body")
          echo "api_status=$code"
          echo "api_preview=$(head -c 500 /tmp/api.json | tr '\n' ' ')"
          test "$code" = "200"

          python - <<'PY'
          import json
          with open('/tmp/api.json') as f:
              data=json.load(f)
          views=['new','trending','topVolume','topGainers']
          assert any(k in data for k in views), f"missing scanner views: {list(data)[:20]}"
          total=0
          non_null=0
          for k in views:
              src=data.get(k)
              if src is None:
                  continue
              non_null += 1
              if isinstance(src, list):
                  total += len(src)
              elif isinstance(src, dict):
                  for key in ('tokens','items','results','data'):
                      if isinstance(src.get(key), list):
                          total += len(src[key])
                          break
          print(f"non_null_views={non_null}")
          print(f"token_count={total}")
          print("source_failures=", data.get('meta',{}).get('sourceFailures'))
          assert non_null > 0
          assert total > 0
          PY
