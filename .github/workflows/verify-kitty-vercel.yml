name: verify-kitty-vercel
on:
  push:
    paths:
      - '.github/workflows/verify-kitty-vercel.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Test OpenDEX directly
        run: |
          set -euo pipefail
          body='{"sources":{"new":{},"trending":{},"topVolume":{},"topGainers":{}}}'
          code=$(curl -sS -D /tmp/headers.txt -o /tmp/opendex.json -w "%{http_code}"             -X POST "https://api.opendex.ws/v2/pages/scanner"             -H 'content-type: application/json'             -H 'accept: application/json'             --data "$body")
          echo "opendex_status=$code"
          echo "cors=$(grep -i '^access-control-allow-origin:' /tmp/headers.txt | tr -d '\r' || true)"
          echo "content_type=$(grep -i '^content-type:' /tmp/headers.txt | tr -d '\r' || true)"
          echo "preview=$(head -c 800 /tmp/opendex.json | tr '\n' ' ')"
          test "$code" = "200"
          python - <<'PY'
          import json
          with open('/tmp/opendex.json') as f:
              data=json.load(f)
          print("keys=", list(data)[:20])
          views=['new','trending','topVolume','topGainers']
          total=0
          for k in views:
              src=data.get(k)
              if isinstance(src, dict):
                  for key in ('tokens','items','results','data'):
                      if isinstance(src.get(key), list):
                          total += len(src[key])
                          break
              elif isinstance(src, list):
                  total += len(src)
          print("token_count=", total)
          print("source_failures=", data.get('meta',{}).get('sourceFailures'))
          assert any(k in data for k in views)
          PY

      - name: Test GitHub Pages fallback
        run: |
          set -u
          URL="https://kshyndina.github.io/defi/"
          code=$(curl -L -sS -o /tmp/pages.html -w "%{http_code}" "$URL" || true)
          echo "pages_status=$code"
          echo "pages_preview=$(head -c 400 /tmp/pages.html | tr '\n' ' ' || true)"

      - name: Diagnose Vercel hostnames
        run: |
          set -u
          for URL in             "https://hello-kitty-opendex-live-kshyndinas-projects.vercel.app"             "https://hello-kitty-opendex-live-2c9bs7tln-kshyndinas-projects.vercel.app"             "https://hello-kitty-opendex-live-mlexlo3xi-kshyndinas-projects.vercel.app"
          do
            echo "=== $URL ==="
            code=$(curl -L -sS -o /tmp/page.html -w "%{http_code}" "$URL/" || true)
            echo "homepage_status=$code"
            echo "preview=$(head -c 250 /tmp/page.html | tr '\n' ' ' || true)"
          done
